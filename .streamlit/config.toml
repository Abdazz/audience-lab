# Configuration Streamlit d'Audience Lab.
# Le thème natif sert de base claire (thème par défaut, pas de flash sombre au premier
# rendu) ; le CSS de audience/theme.py gère le mode sombre, activé par la bascule.

[theme]
base = "light"
primaryColor = "#4F46E5"
backgroundColor = "#F5F7FB"
secondaryBackgroundColor = "#FFFFFF"
textColor = "#0F172A"
font = "sans serif"

[server]
headless = true

[browser]
gatherUsageStats = false

[client]
toolbarMode = "minimal"
